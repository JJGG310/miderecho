<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba del agente de voz</title>
  <!-- Solo para probar agente-voz.js con un window.miderecho falso que imita app.js. No se publica.
       Usa el agente de pruebas (solo localhost, sin sesión firmada). Servir la raíz del repo:
       python3 -m http.server 8000  y abrir http://localhost:8000/agente/prueba.html -->
  <link rel="stylesheet" href="../prototipo/styles.css">
  <style>
    main, section { padding: 1rem; max-width: 46rem; }
    .opciones button { margin: .2rem; }
    #registro, #charla { font: .85rem/1.4 ui-monospace, monospace; background: #fff; border: 1px solid var(--borde); border-radius: 8px; padding: .6rem 1.6rem; }
    #chat { display: flex; gap: .5rem; } #chat input { flex: 1; min-height: 48px; font: inherit; }
  </style>
</head>
<body>
  <header class="barra">
    <span id="asistente" class="asistente" data-estado="reposo" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="44" height="44"><path d="M32 6c14.4 0 26 10.3 26 23S46.4 52 32 52c-3 0-5.9-.4-8.6-1.3L12 56l2.6-10.2C9.3 41.6 6 35.7 6 29 6 16.3 17.6 6 32 6z" fill="#faf6ef"/>
        <g class="ojos"><circle cx="23" cy="26" r="4.2" fill="#1d1b16"/><circle cx="41" cy="26" r="4.2" fill="#1d1b16"/></g>
        <path class="boca" d="M24 36q8 6 16 0" stroke="#b5541b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <ellipse class="boca-abierta" cx="32" cy="37.5" rx="5.5" ry="4.5" fill="#b5541b"/></svg>
    </span>
    <span class="marca">Prueba del agente (mock)</span>
  </header>
  <main id="app"></main>
  <div id="aviso" role="status"></div>
  <section>
    <h2>Llamadas a window.miderecho</h2>
    <ol id="registro"></ol>
    <h2>Probar el agente por texto (sin micrófono)</h2>
    <form id="chat"><input id="msg" placeholder="Escriba como si hablara" aria-label="Mensaje"><button class="principal">Enviar</button></form>
    <ol id="charla"></ol>
  </section>
  <script type="module">
    import { cargarSDK, config, herramientas } from '../prototipo/agente-voz.js';
    const PRUEBA = 'agent_3301m5e2amx2f9etc6k5hzwp7kct';   // "MiDerecho (pruebas locales)": igual al principal, solo localhost
    config.sesion = async () => ({ agentId: PRUEBA });
    const $ = s => document.querySelector(s);
    const anotar = (lista, txt) => $(lista).insertAdjacentHTML('beforeend', `<li>${txt.replace(/</g, '&lt;')}</li>`);
    const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();

    // Pantallas con los mismos títulos y opciones de app.js. [título, texto, opciones, ¿formulario con campo de texto?]
    const P = {
      inicio: ['MiDerecho', '¿Qué necesita hoy?', ['Pedirle algo a una entidad', 'Mis casos']],
      para: ['¿Para quién es este caso?', '', ['Para mí', 'Para un vecino que está conmigo']],
      aviso: ['Antes de empezar', 'MiDerecho es un servicio gratuito. No somos abogados. Responsable: [Organización], [contacto].', ['Sí, acepto', 'No acepto']],
      riesgo: ['Una pregunta importante', '¿Hay alguien en peligro hoy, o le han amenazado por reclamar?', ['No', 'Sí', 'No sé']],
      ayuda: ['Esto es serio. Busque ayuda ahora', 'Si hay peligro ahora: llame al 123. La Personería o la Defensoría pueden activar rutas de protección.', ['Salir']],
      municipio: ['¿Dónde vive?', 'Escriba su vereda.', ['Continuar'], true],
      documento: ['Su documento', 'Yo, Pedro Pérez, cédula 1.234.567.890, celular 310 555 1234. [Aquí está el documento.]', ['Imprimir o guardar en PDF', 'Enviar el documento', 'Borrar todo']],
    };
    const SIGUE = { inicio: { 'Pedirle algo a una entidad': 'para' }, para: { 'Para mí': 'aviso', 'Para un vecino que está conmigo': 'aviso' },
      aviso: { 'Sí, acepto': 'riesgo', 'No acepto': 'inicio' }, riesgo: { 'No': 'municipio', 'Sí': 'ayuda', 'No sé': 'ayuda' }, ayuda: { 'Salir': 'inicio' },
      municipio: { 'Continuar': 'documento' }, documento: { 'Enviar el documento': 'inicio', 'Borrar todo': 'inicio' } };
    let actual = 'inicio';
    function ir(id) {   // como pantalla() de app.js: reemplaza todo main#app
      actual = id;
      const [titulo, texto, ops, campo] = P[id];
      $('#app').innerHTML = `<h1>${titulo}</h1><div class="cuerpo"><p>${texto}</p>${campo ? '<input name="vereda" aria-label="Vereda">' : ''}</div>`
        + `<div class="opciones">${ops.map(o => `<button class="secundario">${o}</button>`).join('')}</div>`;
      $('#app').querySelectorAll('button').forEach(b => b.onclick = () => tocar(b.textContent));
    }
    const tocar = o => { anotar('#registro', `toca ${JSON.stringify(o)}`); const sig = SIGUE[actual]?.[o]; if (sig) ir(sig); };
    window.miderecho = {
      iniciarCaso(datos) { anotar('#registro', 'iniciarCaso ' + JSON.stringify(datos)); ir('para'); },
      pantallaActual() { const [titulo, texto, opciones] = P[actual]; anotar('#registro', 'pantallaActual -> ' + actual); return { id: actual, titulo, texto, opciones }; },
      elegir(texto) {   // igual que app.js: exacta o, si no, la primera que la contenga
        const q = norm(texto), ops = P[actual][2];
        const o = q && (ops.find(o => norm(o) === q) || ops.find(o => norm(o).includes(q)));
        anotar('#registro', `elegir ${JSON.stringify(texto)} -> ${o ? JSON.stringify(o) : 'false'}`);
        if (o) tocar(o);
        return !!o;
      },
      riesgo() { anotar('#registro', 'riesgo()'); ir('ayuda'); },
    };
    ir('inicio');
    window.prueba = { herramientas, ir };   // para revisar a mano desde la consola

    let charla = null;
    $('#chat').onsubmit = async e => {
      e.preventDefault();
      const txt = $('#msg').value.trim(); $('#msg').value = '';
      if (!txt) return;
      if (!charla) {
        const { Conversation } = await cargarSDK();
        charla = await Conversation.startSession({
          agentId: PRUEBA, textOnly: true, clientTools: herramientas,
          onMessage: m => anotar('#charla', `${m.source || m.role}: ${m.message}`),
          onDisconnect: d => { anotar('#charla', '— fin: ' + JSON.stringify(d)); charla = null; },
          onError: m => anotar('#charla', 'ERROR: ' + m),
        });
      }
      anotar('#charla', 'persona: ' + txt);
      charla.sendUserMessage(txt);
    };
  </script>
</body>
</html>
